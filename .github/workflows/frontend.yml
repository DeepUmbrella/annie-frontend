name: Frontend CI and image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_IMAGE: docker.io/library/node:22-alpine
  NGINX_IMAGE: docker.io/library/nginx:alpine
  NPM_REGISTRY: https://registry.npmjs.org
  VITE_API_URL: https://api.linany.com

jobs:
  verify:
    name: Build and smoke-test frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production container
        run: |
          docker build --tag annie-frontend:ci \
            --build-arg NODE_IMAGE \
            --build-arg NGINX_IMAGE \
            --build-arg NPM_REGISTRY \
            --build-arg VITE_API_URL .

      - name: Check Nginx health and the built JavaScript
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 127.0.0.1::80 annie-frontend:ci)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          address=$(docker port "$container" 80/tcp)
          curl --fail --silent --show-error --retry 10 --retry-delay 1 \
            --retry-connrefused --max-time 5 "http://$address/health"
          homepage=$(curl --fail --silent --show-error --max-time 5 "http://$address/")
          entry=$(sed -n 's@.*src="\(/assets/[^" ]*\.js\)".*@\1@p' <<< "$homepage")
          test -n "$entry"
          curl --fail --silent --show-error --max-time 10 --output /dev/null "http://$address$entry"

  publish:
    name: Publish the frontend image to GHCR
    needs: verify
    if: github.repository == 'DeepUmbrella/annie-frontend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/deepumbrella/annie-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable ARM64 builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish the image
        run: |
          set -euo pipefail
          docker buildx create --driver docker-container --use
          metadata="$RUNNER_TEMP/frontend-image.json"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg NODE_IMAGE \
            --build-arg NGINX_IMAGE \
            --build-arg NPM_REGISTRY \
            --build-arg VITE_API_URL \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" --metadata-file "$metadata" .
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$metadata")
          {
            printf '### Published frontend image\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Image: `%s@%s`\n' "$IMAGE" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
